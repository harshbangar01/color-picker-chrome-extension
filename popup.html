<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Color Picker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f3f3f3;
    }

    .modal {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
      width: 300px;
    }

    .changeColorBtn {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .colorGrid {
      width: 100%;
      height: 50px;
      margin-top: 20px;
      border-radius: 5px;
      background-color: #eee;
    }

    .colorValue {
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="modal">
    <h2>Pick a Color</h2>
    <div class="colorGrid"></div>
    <div class="colorValue">#FFFFFF</div>
    <button class="changeColorBtn">Pick Color</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
